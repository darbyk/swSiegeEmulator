<style>
  body {
    margin: 0;
    padding: 24px;
    background: #101a23;
    color: #ecf4f4;
    font-family: system-ui, sans-serif;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
  }
  
  .tower-board {
    position: relative;
    transform-origin: top left;
  }

  .map-viewport {
    width: 100%;
    overflow: hidden;
  }

  .tower-card {
    position: absolute;
    box-sizing: border-box;
    width: 140px;
    min-height: 150px;
    padding: 6px;
    border: 1px solid #38505b;
    background: #192833;
    text-align: center;
  }

  .tower-card img {
    display: block;
    width: 40px;
    aspect-ratio: 1;
    object-fit: contain;
    margin: 0 auto 4px;
  }

  .tower-card h2,
  .tower-card p {
    margin: 3px 0;
  }

  .tower-card h2 {
    font-size: 0.75rem;
  }

  .tower-status {
    color: #9ee6d2;
    font-size: 0.65rem;
  }

  .tower-card button {
    max-width: 100%;
    margin-top: 4px;
    padding: 3px;
    font-size: 0.65rem;
  }
</style>

<main>
  <h1>Towers</h1>
  <p id="status" aria-live="polite"></p>
  <div class="map-viewport">
    <div id="towers" class="tower-board"></div>
  </div>
</main>

<script>
  const towerList = document.querySelector("#towers");
  const status = document.querySelector("#status");
  const mapViewport = document.querySelector(".map-viewport");
  let currentTowers = [];

  function fitMapToViewport() {
    if (currentTowers.length === 0) {
      return;
    }

    const cardWidth = 140;
    const cardHeight = 150;
    const boardWidth = Math.max(...currentTowers.map((tower) => tower.location.x + cardWidth)) + 12;
    const boardHeight = Math.max(...currentTowers.map((tower) => tower.location.y + cardHeight)) + 12;
    const scale = Math.min(1, mapViewport.clientWidth / boardWidth);

    towerList.style.width = `${boardWidth}px`;
    towerList.style.height = `${boardHeight}px`;
    towerList.style.transform = `scale(${scale})`;
    mapViewport.style.height = `${boardHeight * scale}px`;
  }

  function renderTowers(towers) {
    currentTowers = towers;
    towerList.replaceChildren();
    for (const tower of towers) {
      const card = document.createElement("article");
      card.className = "tower-card";
      card.style.left = `${tower.location.x}px`;
      card.style.top = `${tower.location.y}px`;

      const image = document.createElement("img");
      image.src = "/siegeTower.png";
      image.alt = `Siege tower ${tower.name}`;

      const title = document.createElement("h2");
      title.textContent = `${tower.guild} — Tower ${tower.name} (#${tower.number})`;

      const intactCount = [...tower.defenses].filter((state) => state === "O").length;
      const towerStatus = document.createElement("p");
      towerStatus.className = "tower-status";
      towerStatus.textContent = `${intactCount}/${tower.defenses.length} defenses`;

      const attackButton = document.createElement("button");
      attackButton.type = "button";
      attackButton.textContent = "Attack";
      attackButton.addEventListener("click", () => attackTower(tower.number));

      card.append(image, title, towerStatus, attackButton);
      towerList.append(card);
    }

    fitMapToViewport();
  }

  window.addEventListener("resize", fitMapToViewport);

  async function loadTowers() {
    const response = await fetch("/api/towers");
    if (!response.ok) {
      throw new Error("Could not load towers");
    }
    renderTowers(await response.json());
  }

  async function attackTower(towerNumber) {
    status.textContent = `Attacking tower #${towerNumber}...`;
    try {
      const response = await fetch(`/api/towers/${towerNumber}/attack`, { method: "POST" });
      if (!response.ok) {
        const result = await response.json();
        throw new Error(result.error || "Attack failed");
      }
      renderTowers(await response.json());
      status.textContent = `Tower #${towerNumber} was attacked.`;
    } catch (error) {
      status.textContent = error.message;
    }
  }

  loadTowers().catch((error) => {
    status.textContent = error.message;
  });
</script>
